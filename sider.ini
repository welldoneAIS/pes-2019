[sider]
debug = 0
close.on.exit = 0
start.minimized = 1

exe.name = "\PES2019.exe"

free.side.select = 0

; enforce number of match minutes here
; you can set any value from 1 to 255, although you probably
; do not want to go higher than 90, because it will be weird :-)
; 0 - disables this feature.
match.minutes = 0

livecpk.enabled = 1

lua.enabled = 1
; Lua garbage collector option
; two possible values: "step" and "collect"
lua.gc.opt = "step"

lua.module = "lib\CommonLib.lua"
lua.module = "EvoSwitcher\EvoMockStadium.lua"
lua.module = "EvoSwitcher\StadiumServer.lua"
lua.module = "EvoSwitcher\EvoOther.lua"
lua.module = "EvoSwitcher\EvoBall.lua"
lua.module = "EvoSwitcher\EvoBanner.lua"
lua.module = "EvoSwitcher\EvoCornerFlag.lua"
;lua.module = "EvoSwitcher\EvoDynamicCamera.lua"
lua.module = "EvoSwitcher\EvoFanViewCamera.lua"
lua.module = "EvoSwitcher\EvoGraphic.lua"
lua.module = "EvoSwitcher\EvoKit.lua"
lua.module = "EvoSwitcher\EvoLiveBroadcastCamera.lua"
lua.module = "EvoSwitcher\EvoManagerKit.lua"
lua.module = "EvoSwitcher\EvoPressRoom.lua"
lua.module = "EvoSwitcher\EvoReferee.lua"
lua.module = "EvoSwitcher\EvoEntrance.lua"
lua.module = "EvoSwitcher\EvoScene.lua"
lua.module = "EvoSwitcher\EvoRenders.lua"
lua.module = "EvoSwitcher\EvoScoreboard.lua"
lua.module = "EvoSwitcher\EvoSetting.lua"
lua.module = "EvoSwitcher\EvoBoard.lua"
lua.module = "EvoSwitcher\EvoStartScreens.lua"
lua.module = "EvoSwitcher\EvoGoalSong.lua"
lua.module = "EvoSwitcher\EvoGoal.lua"

; overlay settings
overlay.enabled = 0
overlay.on-from-start = 0
; location on screen: top|bottom
overlay.location = "top"
; size of the font (0 - automatic)
overlay.font-size = 0
overlay.font = "Arial Bold"
; overlay hot keys:
; 0x20 - [space] - toggle overlay on/off
; 0x31 - [1] - pass overlay control to next module
overlay.vkey.toggle = 0x20
overlay.vkey.next-module = 0x31
; colors are in RRGGBBAA format
overlay.background-color = "00158bc0"
overlay.text-color = "90c5ffff"
overlay.image-alpha-max = 0.8

; boost game process pririty if needed
;game.priority.class = "high"

; Reload modified Lua modules
; Default combination: Shift-R
vkey.reload-1 = 0x10
vkey.reload-2 = 0x52

